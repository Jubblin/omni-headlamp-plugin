name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: verified safe for this dependency tree (esbuild's
      # own postinstall isn't load-bearing here -- npm's optionalDependencies
      # resolution alone correctly selects the platform binary; tsc/test/build
      # all pass against a clean --ignore-scripts install). Otherwise every
      # transitive dependency's install-time script runs unsandboxed in CI,
      # which is real supply-chain exposure for no benefit in this tree.
      - run: npm ci --ignore-scripts

      - run: npm run format -- --check

      - run: npm run tsc

      - run: npm run lint

      - run: npm test

      - run: npm run build

  visual-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: gather-system-info
        id: system-info
        uses: kenchan0130/actions-system-info@59699597e84e80085a750998045983daa49274c4 # version: v1.4.0
        continue-on-error: true
        
      - name: print-system-info
        run: |
          MEMORY_GB=$((${{ steps.system-info.outputs.totalmem }}/1024/1024/1024))

          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "NodeName: ${NODE_NAME}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Kernel version: ${{ steps.system-info.outputs.kernel-version }}"
            "Name: ${{ steps.system-info.outputs.name }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Release: ${{ steps.system-info.outputs.release }}"
            "Total memory: ${MEMORY_GB} GB"
          )

          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
          done
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Only the smoke-test's own driver needs a real browser -- the plugin
      # bundle itself is built inside deploy/Dockerfile's own Node stage.
      # --no-install: use the playwright devDependency npm ci already
      # installed above, never fetch a different version on demand.
      - run: npx --no-install playwright install --with-deps chromium

      - run: make screenshots

      # Playwright names the video with a random hash -- give it a fixed name
      # so it can be uploaded as its own named artifact below, same as every
      # screenshot. Runs whether the smoke test passed or failed.
      - name: Rename video to a fixed filename
        if: always()
        run: mv screenshots/*.webm screenshots/session-recording.webm 2>/dev/null || true

      # One artifact per file, not one zip of all of them (see issue #29):
      # GitHub renders a single-file image artifact inline in the Actions UI,
      # so a reviewer can glance at a screenshot without downloading and
      # unzipping anything. if-no-files-found: ignore since which files exist
      # depends on how far scripts/visual-smoke-test.mjs got before failing
      # (FAILURE.png only exists on a failure; later screenshots don't exist
      # if it failed on an earlier page).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-01-home-sidebar
          path: screenshots/01-home-sidebar.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-02-omni-clusters
          path: screenshots/02-omni-clusters.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-03-omni-config-patches
          path: screenshots/03-omni-config-patches.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-04-settings-plugins
          path: screenshots/04-settings-plugins.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-05-authenticated-clusters
          path: screenshots/05-authenticated-clusters.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-06-authenticated-cluster-create
          path: screenshots/06-authenticated-cluster-create.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-FAILURE
          path: screenshots/FAILURE.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke-test-recording
          path: screenshots/session-recording.webm
          if-no-files-found: ignore
          retention-days: 14
