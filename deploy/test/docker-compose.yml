# Disposable Omni + mock-OIDC + Headlamp-with-this-plugin stack for
# scripts/visual-smoke-test.mjs's post-authentication run. Run via `make screenshots` (see
# Makefile), which generates the throwaway credentials this depends on first
# (scripts/setup-test-omni.sh) -- don't run `docker compose up` here directly without that step,
# deploy/test/.generated/ won't exist yet.
# Static subnet + fixed IPs so headlamp resolves "omni" via /etc/hosts
# (extra_hosts below) instead of Docker's embedded DNS resolver
# (127.0.0.11) -- that resolver intermittently answered "server misbehaving"
# for a sibling service's name in CI (2026-08-23, reproduced 2/2 runs, every
# retry over 15+ seconds, so not a one-off blip), a known class of flakiness
# on some Docker/network-driver combinations. /etc/hosts lookups never touch
# that resolver at all.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  dex:
    image: dexidp/dex:v2.41.1
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
    networks:
      default:
        ipv4_address: 172.28.0.2
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://localhost:8080/dex/.well-known/openid-configuration',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  omni:
    image: ghcr.io/siderolabs/omni:latest
    cap_add:
      - NET_ADMIN
    command: ['--config-path=/etc/omni/config.yaml']
    volumes:
      - ./omni-config.yaml:/etc/omni/config.yaml:ro
      - ./.generated/certs:/certs:ro
      - omni-out:/out
    networks:
      default:
        ipv4_address: 172.28.0.3
    ports:
      - '${OMNI_HOST_PORT:-8099}:8099'
    depends_on:
      dex:
        condition: service_healthy

  headlamp:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      # Go's crypto/x509 reads this to trust omni's self-signed cert for the
      # /externalproxy call the "Connect to Omni" flow makes -- omni:8099 is
      # the only host -proxy-urls ever lets this container reach, so trusting
      # just this one cert (not merging into the system pool) is sufficient.
      # Set at container start, not appended+restarted at runtime -- no race
      # with the smoke test's first request.
      SSL_CERT_FILE: /certs/omni.pem
    volumes:
      - ./.generated/certs:/certs:ro
    extra_hosts:
      - 'omni:172.28.0.3'
    command:
      - -in-cluster=false
      - -kubeconfig=/dev/null
      - -listen-addr=0.0.0.0
      - -port=4466
      - -proxy-urls=https://omni:8099/*
    ports:
      - '4466:4466'
    depends_on:
      - omni

volumes:
  omni-out:
